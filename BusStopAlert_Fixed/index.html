<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון מרחק לתחנת אוטובוס</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="title-icon">📍</span>
                    מחשבון מרחק לתחנה
                </h1>
                <p class="subtitle">גלה כמה רחוק אתה מתחנת האוטובוס שלך</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <label for="lat-input" class="input-label">קו רוחב (Latitude)</label>
                    <input 
                        type="number" 
                        id="lat-input" 
                        class="input-field" 
                        placeholder="32.0853"
                        step="any"
                    />
                </div>
                
                <div class="input-group">
                    <label for="lng-input" class="input-label">קו אורך (Longitude)</label>
                    <input 
                        type="number" 
                        id="lng-input" 
                        class="input-field" 
                        placeholder="34.7818"
                        step="any"
                    />
                </div>

                <button id="calculate-btn" class="btn btn-primary">
                    <span class="btn-icon">🎯</span>
                    חשב מרחק
                </button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="results-section" style="display: none;">
                <div class="result-card">
                    <div class="result-icon">📏</div>
                    <div class="result-content">
                        <h3 class="result-title">המרחק שלך</h3>
                        <p class="result-value" id="distance-value">-</p>
                        <p class="result-subtitle" id="walking-time">-</p>
                    </div>
                </div>

                <div class="location-info">
                    <div class="info-item">
                        <span class="info-label">המיקום שלך:</span>
                        <span class="info-value" id="user-location">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">תחנת האוטובוס:</span>
                        <span class="info-value" id="station-location">-</span>
                    </div>
                </div>
            </section>

            <!-- Map Section -->
            <section class="map-section">
                <div id="map" class="map-container"></div>
                <div class="map-legend">
                    <div class="legend-item">
                        <div class="legend-marker legend-marker-user"></div>
                        <span>המיקום שלך</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-marker legend-marker-station"></div>
                        <span>תחנת אוטובוס</span>
                    </div>
                </div>
            </section>

            <!-- Status Messages -->
            <div id="status-message" class="status-message"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>האפליקציה משתמשת במיקום הנוכחי שלך לחישוב מדויק</p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
